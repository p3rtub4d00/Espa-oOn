services:
  - type: web
    name: espacoon
    runtime: node
    repo: https://github.com/p3rtub4d00/Espa-oOn
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_ENV
        value: production
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

      - key: BACKUP_MONGODB_URI
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: 14
      - key: BACKUP_INTERVAL_HOURS
        value: 24
